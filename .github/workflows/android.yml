name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Esto permite darle a un botón para reintentar

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Check files
      run: ls -R # Esto nos dirá en el log si los archivos están ahí

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug --stacktrace
